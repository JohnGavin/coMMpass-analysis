name: 05 R Package Check

on:
  push:
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'
      - '.github/workflows/05-check.yaml'
      - 'default_ci.nix'
  pull_request:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'man/**'
      - 'vignettes/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v14
        with:
          name: johngavin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: rstats-on-nix

      - name: Document
        run: |
          nix-shell default_ci.nix --run "Rscript -e 'devtools::document()'"

      - name: Test
        run: |
          nix-shell default_ci.nix --run "Rscript -e 'devtools::test()'"

      - name: Check
        run: |
          nix-shell default_ci.nix --run "Rscript -e 'devtools::check(args = c(\"--no-vignettes\", \"--no-manual\"), error_on = \"error\")'"
