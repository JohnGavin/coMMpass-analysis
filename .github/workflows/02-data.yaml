name: 02 Data Acquisition

on:
  workflow_dispatch:

jobs:
  acquire-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v14
        with:
          name: johngavin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: rstats-on-nix

      - name: Check if previous runs exist
        id: runs-exist
        run: git ls-remote --exit-code --heads origin targets-runs
        continue-on-error: true

      - name: Checkout previous run
        if: steps.runs-exist.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: targets-runs
          fetch-depth: 1
          path: .targets-runs

      - name: Restore output files from previous run
        if: steps.runs-exist.outcome == 'success'
        run: |
          nix-shell --pure default_ci.nix --run "Rscript -e 'for (dest in scan(\".targets-runs/.targets-files\", what = character())) {
            source <- file.path(\".targets-runs\", dest)
            if (!file.exists(dirname(dest))) dir.create(dirname(dest), recursive = TRUE)
            if (file.exists(source)) file.rename(source, dest)
          }'"

      - name: Run Pipeline
        run: |
          nix-shell --pure default_ci.nix --run "CI=true GITHUB_ACTIONS=true Rscript -e 'targets::tar_make(callr_function = NULL)'"

      - name: Identify pipeline output files
        if: success()
        run: |
          # List all modified/untracked files as pipeline outputs.
          # If data grows large, add exclusions here to keep targets-runs lean:
          #   git ls-files -mo --exclude=renv --exclude='data/raw/*.parquet' > .targets-files
          # Or exclude specific patterns:
          #   --exclude='_targets/objects/large_*'
          # Current data is ~1MB with sample_limit=10 in CI, so no exclusions needed.
          git ls-files -mo --exclude=renv > .targets-files

      - name: Create targets-runs branch if needed
        if: success() && steps.runs-exist.outcome != 'success'
        run: git checkout --orphan targets-runs

      - name: Switch to targets-runs branch
        if: success() && steps.runs-exist.outcome == 'success'
        run: |
          rm -r .git
          mv .targets-runs/.git .
          rm -r .targets-runs

      - name: Push pipeline state
        if: success()
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          rm -rf .gitignore .github/workflows
          git add --all -- ':!renv'
          for file in $(git ls-files -mo --exclude=renv); do
            git add --force $file
          done
          git commit -am "Run pipeline" || echo "No changes to commit"
          git push origin targets-runs

      - name: Upload failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-${{ github.run_id }}
          path: _targets/meta/
          retention-days: 7
