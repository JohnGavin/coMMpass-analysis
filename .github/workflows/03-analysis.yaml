name: 03 Compute Analysis

on:
  workflow_run:
    workflows: ["02 Data Acquisition"]
    types:
      - completed
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v9
      - uses: DeterminateSystems/magic-nix-cache-action@v2
      - uses: cachix/cachix-action@v14
        with:
          name: johngavin
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: rstats-on-nix

      - name: Download Data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
             RUN_ID=${{ github.event.workflow_run.id }}
          else
             # Find latest success for Data workflow
             RUN_ID=$(gh run list --workflow 02-data.yaml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          
          echo "Downloading data from Run ID: $RUN_ID"
          gh run download $RUN_ID -n raw-data-store
          
          # gh run download might put it in a subdir 'raw-data-store'
          if [ -d "raw-data-store" ]; then
             cp -r raw-data-store/* .
             rm -rf raw-data-store
          fi
          
          ls -R data/
          ls -F _targets/

      - name: Run Analysis Targets
        run: |
          # Run only analysis targets (data targets already complete from workflow 02)
          nix-shell --pure default_ci.nix --run "Rscript -e '
            targets::tar_make(
              names = c(
                \"clinical_data_clean\",
                \"expression_data_clean\",
                \"integrated_data\",
                \"data_quality_report\",
                \"qc_metrics\",
                \"filtered_data\",
                \"normalized_data\",
                \"deseq2_results\",
                \"edger_results\",
                \"limma_results\",
                \"consensus_de_genes\",
                \"de_report\"
              ),
              callr_function = NULL
            )
          '"

      - name: Upload Analysis Store
        uses: actions/upload-artifact@v4
        with:
          name: analysis-store
          path: |
            _targets/
            data/
          retention-days: 1
