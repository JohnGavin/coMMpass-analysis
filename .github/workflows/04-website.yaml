name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'DESCRIPTION'
      - 'README.md'
      - '.github/workflows/04-website.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::quarto
            any::knitr
            any::rmarkdown
            any::targets
            any::DT
            any::ggplot2
            any::htmltools
            any::here

      - name: Build pkgdown site
        run: Rscript -e "pkgdown::build_site(new_process = FALSE)"
        env:
          IN_PKGDOWN: true

      - name: Verify no rendering errors in HTML output
        run: |
          errors=0
          for f in docs/articles/*.html; do
            # Check for R error output patterns
            if grep -qP '#&gt; Error|#&gt; NULL|not available|could not find file' "$f" 2>/dev/null; then
              echo "::error file=$f::Rendering errors found in $(basename $f)"
              grep -nP '#&gt; Error|#&gt; NULL|not available|could not find file' "$f" | head -5
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::$errors vignette(s) contain rendering errors"
            exit 1
          fi
          echo "All vignettes clean"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        id: deployment
