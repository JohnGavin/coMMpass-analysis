name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'inst/extdata/**'
      - 'DESCRIPTION'
      - 'README.md'
      - '.github/workflows/04-website.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::quarto
            any::knitr
            any::rmarkdown
            any::targets
            any::DT
            any::ggplot2
            any::htmltools
            any::visNetwork
            any::here

      - name: Build pkgdown site
        run: |
          Rscript -e '
            tryCatch(
              pkgdown::build_site(new_process = FALSE, quiet = FALSE),
              error = function(e) {
                message("\n\npkgdown error: ", conditionMessage(e))
                message("\n--- Rendering individual vignettes for diagnostics ---")
                qmds <- list.files("vignettes", pattern = "\\.qmd$", full.names = TRUE)
                for (f in qmds) {
                  message("\n>>> Rendering: ", f)
                  ok <- tryCatch({
                    system2("quarto", c("render", f, "--output-dir", "/tmp/qmd_test",
                      "--to", "html"), stdout = TRUE, stderr = TRUE,
                      env = c(paste0("IN_PKGDOWN=true")))
                    message("    OK: ", f)
                    TRUE
                  }, warning = function(w) {
                    message("    WARN: ", f, " - ", conditionMessage(w))
                    TRUE
                  }, error = function(e2) {
                    message("    FAIL: ", f, " - ", conditionMessage(e2))
                    FALSE
                  })
                }
                stop(e)
              }
            )
          '
        env:
          IN_PKGDOWN: true

      - name: Verify no rendering errors in HTML output
        run: |
          errors=0
          warnings=0
          for f in docs/articles/*.html; do
            name=$(basename "$f")

            # Check 1: R error output patterns (FATAL)
            if grep -qP '#&gt; Error|#&gt; NULL|#&gt;.*not available|#&gt;.*could not find' "$f" 2>/dev/null; then
              echo "::error file=$f::Rendering errors found in $name"
              grep -nP '#&gt; Error|#&gt; NULL|#&gt;.*not available|#&gt;.*could not find' "$f" | head -5
              errors=$((errors + 1))
            fi

            # Check 2: knitr::kable output (should be DT) (WARNING)
            if grep -qP 'class="kable' "$f" 2>/dev/null; then
              echo "::warning file=$f::knitr::kable table found in $name (should be DT::datatable)"
              warnings=$((warnings + 1))
            fi

            # Check 3: Missing sessionInfo (WARNING)
            if ! grep -qP 'sessionInfo|Session Info|session-info' "$f" 2>/dev/null; then
              echo "::warning file=$f::No sessionInfo found in $name"
              warnings=$((warnings + 1))
            fi
          done

          # Summary
          echo "=== Validation Summary ==="
          echo "Errors: $errors"
          echo "Warnings: $warnings"

          if [ $errors -gt 0 ]; then
            echo "::error::$errors vignette(s) contain rendering errors"
            exit 1
          fi
          echo "All vignettes clean"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        id: deployment
