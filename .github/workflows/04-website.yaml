name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'man/**'
      - 'vignettes/**'
      - '_pkgdown.yml'
      - 'pkgdown/**'
      - 'DESCRIPTION'
      - 'README.md'
      - '.github/workflows/04-website.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::quarto
            any::knitr
            any::rmarkdown
            any::targets
            any::DT
            any::ggplot2
            any::htmltools
            any::here

      - name: Build pkgdown site
        run: |
          Rscript -e "pkgdown::build_site(new_process = FALSE)" || {
            echo "::group::Detailed quarto diagnostics"
            Rscript -e "tryCatch(pkgdown::build_articles(lazy = FALSE), error = function(e) message(conditionMessage(e)))" 2>&1 || true
            echo "::endgroup::"
            exit 1
          }
        env:
          IN_PKGDOWN: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - uses: actions/deploy-pages@v4
        id: deployment
