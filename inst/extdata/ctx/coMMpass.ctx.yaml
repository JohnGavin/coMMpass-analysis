kind: function
name: query_commpass_parquet
exported: true
signature: query_commpass_parquet(data_type = c("clinical", "biospecimen", "rnaseq_counts","rnaseq_sample_metadata", "rnaseq_gene_metadata"),data_dir = "data/raw",filters = NULL,collect = TRUE) {data_type <- match.arg(data_type)
arguments:
  collect: If TRUE (default), collect results into a data frame.
  data_dir: Base directory containing parquet files
  data_type: One of "clinical", "biospecimen", "rnaseq_counts", "rnaseq_sample_metadata", "rnaseq_gene_metadata"
  filters: Optional named list of filters.
returns: A data frame (if collect=TRUE) or lazy dbplyr tbl
---
kind: function
name: get_commpass_tbl
exported: true
signature: get_commpass_tbl(data_type = c("clinical", "biospecimen", "rnaseq_counts","rnaseq_sample_metadata", "rnaseq_gene_metadata"),data_dir = "data/raw",con = NULL) {data_type <- match.arg(data_type)
arguments:
  con: An existing DuckDB connection.
  data_dir: Base directory containing parquet files
  data_type: One of "clinical", "biospecimen", "rnaseq_counts", "rnaseq_sample_metadata", "rnaseq_gene_metadata"
returns: A lazy dbplyr tbl.
