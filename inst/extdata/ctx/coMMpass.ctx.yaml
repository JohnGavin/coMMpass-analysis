kind: function
name: download_gdc_rnaseq
exported: true
signature: download_gdc_rnaseq(project_id = "MMRF-COMMPASS",data_dir = "data/raw/gdc",sample_limit = 200,random_sample = TRUE,seed = 42,use_parquet = TRUE)
arguments:
  data_dir: Directory to save data
  project_id: 'Project identifier (default: "MMRF-COMMPASS")'
  random_sample: If TRUE and sample_limit is set, randomly sample patients using seed for reproducibility (default...
  sample_limit: Maximum number of samples (NULL for all, default 200)
  seed: Random seed for reproducible sampling (default 42)
  use_parquet: If TRUE, also save parquet files alongside RDS (default TRUE)
returns: Path to the saved RDS file containing the SummarizedExperiment
---
kind: function
name: download_clinical_data
