---
kind: context_header
llm_instructions: This is an LLM-optimized API specification for the R package 'coMMpass'. Use this context to write correct code using coMMpass functions. Each 'function' record describes a public function with its signature, arguments, and purpose. The 'package' record contains metadata. All listed functions are part of the public API.
---
kind: package
schema_version: '1.1'
name: coMMpass
version: 0.1.0
language: R
description: MMRF CoMMpass Data Analysis Pipeline
---
kind: function
name: format_file_size
exported: true
