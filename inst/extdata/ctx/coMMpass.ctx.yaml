kind: function
name: run_gsea
exported: true
signature: run_gsea(de_results,gene_sets = "hallmark",gene_id_type = "ensembl_gene",min_size = 15L,max_size = 500L)
arguments:
  de_results: Data frame of DE results.
  gene_id_type: 'Type of gene identifiers: "ensembl_gene" (default), "gene_symbol", or "entrez_gene".'
  gene_sets: 'Character string specifying the MSigDB collection: "hallmark" (default), "kegg", "reactome", "go_bp", "go_mf", "go_cc", "c2", "c7".'
  max_size: 'Maximum gene set size (default: 500).'
  min_size: 'Minimum gene set size (default: 15).'
returns: 'List with components: Data frame with pathway, NES, pval, padj, size, leadingEdge columns.'
---
kind: function
name: run_ora
exported: true
signature: run_ora(sig_genes,universe,gene_sets = "hallmark",gene_id_type = "ensembl_gene",min_size = 10L,max_size = 500L)
arguments:
  gene_id_type: 'Type of gene identifiers: "ensembl_gene" (default), "gene_symbol", or "entrez_gene".'
  gene_sets: Character string specifying the MSigDB collection (same options as [run_gsea()]), or a named list of character vectors.
  max_size: 'Maximum gene set size (default: 500).'
  min_size: 'Minimum gene set size (default: 10).'
  sig_genes: Character vector of significant gene identifiers.
  universe: Character vector of all tested gene identifiers (background).
returns: 'List with components: Data frame with pathway, overlap, gene_set_size, universe_size, p_value, padj, odds_ratio, overlapping_genes.'
