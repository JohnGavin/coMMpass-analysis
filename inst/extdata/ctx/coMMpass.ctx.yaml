kind: function
name: run_deseq2
exported: true
signature: run_deseq2(se_data,clinical_data,design_formula = ~condition,shrink_lfc = TRUE,paired = FALSE)
arguments:
  clinical_data: Clinical data frame
  design_formula: Design formula for the model
  paired: If TRUE, use paired longitudinal design with patient as blocking factor.
  se_data: A SummarizedExperiment object
  shrink_lfc: If TRUE, apply apeglm LFC shrinkage (default TRUE)
returns: List with DE results including raw and shrunken (if requested)
