url: https://JohnGavin.github.io/coMMpass-analysis/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    preset: "shiny"

reference:
- title: "Data Acquisition"
  desc: "Download RNA-seq and clinical data from GDC and AWS S3"
  contents:
  - has_concept("data-acquisition")

- title: "Data Cleaning"
  desc: "Clean and integrate clinical and expression data"
  contents:
  - has_concept("data-cleaning")

- title: "Data Dictionary"
  desc: "Variable documentation and metadata"
  contents:
  - has_concept("data-dictionary")

- title: "Quality Control"
  desc: "QC metrics, filtering, and normalization"
  contents:
  - has_concept("quality-control")

- title: "Differential Expression"
  desc: "DESeq2, edgeR, limma-voom, consensus analysis, and DE visualization"
  contents:
  - has_concept("differential-expression")

- title: "Survival Analysis"
  desc: "Kaplan-Meier, Cox PH, forest plots, marker-stratified survival"
  contents:
  - has_concept("survival")

- title: "Pathway Analysis"
  desc: "GSEA, ORA, MSigDB gene sets, gene annotation, enrichment visualization"
  contents:
  - has_concept("pathway")

- title: "Cytogenetics"
  desc: "FISH/cytogenetic extraction, risk classification, oncoprint, co-occurrence"
  contents:
  - has_concept("cytogenetics")

- title: "Storage"
  desc: "DuckDB-backed parquet querying"
  contents:
  - has_concept("storage")

- title: "API"
  desc: "Plumber API endpoints for programmatic data access"
  contents:
  - has_concept("api")

- title: "Utilities"
  desc: "Shared helpers for formatting and summaries"
  contents:
  - has_concept("utilities")

- title: "Internal"
  desc: "Internal helper functions (not exported)"
  contents:
  - check_dependencies
  - create_project_dirs
  - download_aws_data
  - filter_low_quality
  - find_consensus_genes
  - generate_summary_report
  - normalize_rnaseq
  - render_de_report
  - run_edger
  - run_limma
  - save_timestamped
  - setup_logging
  - summarize_data

