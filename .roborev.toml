# No per-repo `agent` pin: inherit the global default_agent (gemini) and
# default_backup_agent (claude-code). This repo previously pinned
# agent = "codex" (commit 7801158, 2026-05-13). codex was globally abandoned
# as a backup in 2026-07 (llm#723, "codex failing 6/6") and its credential
# now returns HTTP 401 invalid_api_key, so the pin made every review here
# fail terminally — the repo set no backup_agent, so a codex failure had no
# fallback. See llm#964.
review_context_count = 3
excluded_commit_patterns = ["[skip review]", "docs: rebuild pkgdown", "chore: gitignore"]
review_reasoning = "standard"
fix_reasoning = "standard"
refine_reasoning = "standard"
fix_min_severity = "medium"
refine_min_severity = "medium"
review_guidelines = """
R package (coMMpass) — genomics/myeloma analysis. Review for:
- PHI/patient identifiers in code or comments
- suppressWarnings(as.*) anti-pattern
- DBI::dbGetQuery (use duckplyr instead)
- Bioconductor API correctness (SummarizedExperiment, DESeq2)
- Hardcoded values in vignettes (must use tar_read)
- Missing cli::cli_abort (use instead of stop())
- Lab measurement units should be explicit
- Diffs are structural (difftastic/tree-sitter) — formatting changes are invisible, focus on semantic changes only
"""
